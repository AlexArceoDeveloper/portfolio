services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: automation
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automation -d automation"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:4.9
    environment:
      SERVICES: s3
      STORAGE_BUCKET: agent-artifacts
    volumes:
      - ./infrastructure/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    ports:
      - "4566:4566"

  neural-router:
    build: ./services/neural-router
    ports:
      - "8091:8091"

  otel-collector:
    image: otel/opentelemetry-collector:0.134.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      neural-router:
        condition: service_started
      localstack:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8080
      Persistence__Provider: postgres
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=automation;Username=automation;Password=local-development-only
      Routing__Provider: python
      Routing__Endpoint: http://neural-router:8091/classify
      Storage__Provider: s3
      Storage__Bucket: agent-artifacts
      Storage__ServiceUrl: http://localstack:4566
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-west-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8086:8080"
