apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: commerce-api
  template:
    metadata:
      labels:
        app: commerce-api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: commerce-api
          image: portfolio-commerce:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-secrets
                  key: postgres-password
            - name: ConnectionStrings__Commerce
              value: Host=postgres;Port=5432;Database=commerce;Username=commerce;Password=$(POSTGRES_PASSWORD)
            - name: Payments__WebhookSecret
              valueFrom:
                secretKeyRef:
                  name: commerce-secrets
                  key: webhook-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: commerce-api
spec:
  selector:
    app: commerce-api
  ports:
    - name: http
      port: 80
      targetPort: http
